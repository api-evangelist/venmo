name: Venmo
description: >-
  Venmo is a US mobile payments service owned by PayPal that lets people send,
  receive, and split money with friends, pay approved businesses, and hold a
  balance backed by a debit and credit card. For developers, Venmo does not
  publish a standalone first-party public API; the historical developer.venmo.com
  OAuth API is no longer offered to new developers. Instead, "Pay with Venmo" is
  exposed to US merchants through PayPal Braintree via its GraphQL API and the
  Android, iOS, and JavaScript SDKs, with webhooks and a Braintree sandbox for
  testing. Venmo's compliance and vulnerability-disclosure posture is inherited
  from PayPal (Level 1 PCI DSS, SOC 2 Type 2, PayPal Bug Bounty on HackerOne).
